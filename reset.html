<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Réinitialisation CreditTrack…</title>
<style>
  body { margin:0; background:#060A14; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family:sans-serif; color:#fff; flex-direction:column; gap:20px; }
  .spinner { width:48px; height:48px; border:4px solid rgba(255,255,255,0.1); border-top-color:#00A3FF; border-radius:50%; animation:spin 0.8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  p { color:rgba(255,255,255,0.6); font-size:0.9rem; }
</style>
</head>
<body>
<div class="spinner"></div>
<p>Nettoyage du cache en cours…</p>
<script>
  (async function() {
    // 1. Désenregistrer tous les Service Workers
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      for (const reg of regs) await reg.unregister();
    }
    // 2. Vider tous les caches
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    // 3. Vider le localStorage activeView
    localStorage.removeItem('activeView');
    // 4. Rediriger vers la page d'accueil fraîche avec timestamp anti-cache
    window.location.replace('index.html?v=' + Date.now());
  })();
</script>
</body>
</html>
